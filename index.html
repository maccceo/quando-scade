<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Quando scade?" />
  <meta name="description" content="Tieni d'occhio la scadenza dei prodotti alimentari." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <title>Quando scade?</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-block">
        <p class="brand">Quando scade?</p>
        <p class="tagline" id="subtitle">I tuoi prodotti</p>
      </div>
    </header>

    <main class="content" id="main">
      <section class="soon-block" id="soonBlock" aria-labelledby="soonHeading">
        <h2 class="section-title" id="soonHeading">stanno per scadere!</h2>
        <ul class="product-list" id="soonList" aria-live="polite"></ul>
        <p class="soon-empty" id="soonEmpty">niente in scadenza nel breve</p>
      </section>

      <div id="catalog" class="catalog"></div>

      <div class="empty" id="emptyState" hidden>
        <div class="empty-mark" aria-hidden="true"></div>
        <h2>Niente in frigo (ancora)</h2>
        <p>Aggiungi un prodotto e la sua data di scadenza.</p>
      </div>
    </main>

    <button type="button" class="fab" id="fabAdd" aria-label="Aggiungi prodotto">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Add / Edit sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <aside class="sheet" id="formSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheetTitle">Nuovo prodotto</h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="Chiudi">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <form id="productForm" autocomplete="off" novalidate>
      <input type="hidden" id="editId" value="" />
      <label class="field">
        <span>Nome</span>
        <input type="text" id="productName" name="name" required maxlength="80" placeholder="es. Yogurt greco" enterkeyhint="next" />
        <ul class="suggest" id="suggestions" role="listbox" hidden></ul>
      </label>

      <fieldset class="field category-field">
        <legend>Categoria</legend>
        <div class="chip-row" id="categoryChips" role="radiogroup" aria-label="Categoria">
          <button type="button" class="chip" data-category="colazione" aria-pressed="false">colazione</button>
          <button type="button" class="chip" data-category="primi" aria-pressed="false">primi</button>
          <button type="button" class="chip" data-category="secondi" aria-pressed="false">secondi</button>
          <button type="button" class="chip" data-category="contorni" aria-pressed="false">contorni</button>
          <button type="button" class="chip" data-category="snack" aria-pressed="false">snack</button>
        </div>
      </fieldset>

      <label class="check-row" for="longShelf">
        <input type="checkbox" id="longShelf" name="longShelf" />
        <span>lunga conservazione</span>
      </label>

      <label class="field" id="expiryField">
        <span>Scadenza</span>
        <span class="date-clip">
          <input type="date" id="productExpiry" name="expiry" required />
        </span>
      </label>

      <div class="sheet-actions">
        <button type="submit" class="btn primary" id="saveBtn">Salva</button>
        <button type="button" class="btn danger ghost" id="deleteBtn" hidden>Elimina</button>
      </div>
    </form>
  </aside>

  <div class="confirm-overlay" id="confirmOverlay" hidden>
    <div class="confirm-dialog" id="confirmDialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmMessage">
      <p id="confirmMessage">Sei sicuro di voler eliminare l’elemento?</p>
      <div class="confirm-actions">
        <button type="button" class="btn ghost" id="confirmNo">No</button>
        <button type="button" class="btn danger" id="confirmYes">Sì</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" defer></script>
</body>
</html>
